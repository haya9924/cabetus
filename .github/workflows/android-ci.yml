name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android APKs and run JVM tests
        run: |
          ./gradlew --no-daemon --no-parallel --max-workers=1 --console=plain --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleBeta
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cabetus-installable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload instrumentation test APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cabetus-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cabetus-beta-unsigned
          path: app/build/outputs/apk/beta/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  schedule-notices-device:
    name: CLASS notices on Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cabetus-installable-apk
          path: apks/debug
      - uses: actions/download-artifact@v4
        with:
          name: cabetus-android-test-apk
          path: apks/androidTest
      - name: Enable KVM for the ephemeral emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install apks/debug/app-debug.apk
            adb install -t apks/androidTest/app-debug-androidTest.apk
            adb shell am instrument -w -r -e suite schedule-notices org.cabetus.debug.test/org.cabetus.AttendanceIntegrationInstrumentation | tee "$RUNNER_TEMP/class-schedule-device.log"
            grep -F 'INSTRUMENTATION_RESULT: schedule_notices=PASS' "$RUNNER_TEMP/class-schedule-device.log"
