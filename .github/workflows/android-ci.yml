name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android APKs and run JVM tests
        run: |
          ./gradlew --no-daemon --no-parallel --max-workers=1 --console=plain --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleBeta
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cabetus-installable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload instrumentation test APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cabetus-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cabetus-beta-unsigned
          path: app/build/outputs/apk/beta/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
